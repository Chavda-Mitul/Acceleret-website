# Install only after obtaining the acceleret.com/www.acceleret.com certificate.
server {
    listen 80;
    listen [::]:80;
    server_name acceleret.com www.acceleret.com;
    location /.well-known/acme-challenge/ { root /var/lib/acceleret-acme; }
    location / { return 301 https://acceleret.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.acceleret.com;
    ssl_certificate /etc/letsencrypt/live/acceleret.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acceleret.com/privkey.pem;
    return 301 https://acceleret.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name acceleret.com;
    ssl_certificate /etc/letsencrypt/live/acceleret.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acceleret.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    location / {
        include /opt/acceleret/nginx-upstream.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cookie_flags payload-token secure httponly samesite=lax;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
