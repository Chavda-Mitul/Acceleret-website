name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Production checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: acceleret
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: acceleret_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acceleret -d acceleret_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URI: postgres://acceleret:ci-only-password@127.0.0.1:5432/acceleret_ci
      PAYLOAD_SECRET: ci-only-not-a-production-secret-acceleret
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Deployment regression tests
        run: python3 -m unittest discover -s deploy/vps -p '*_test.py' -v
      - run: npm run migrate
      - name: Seed isolated browser fixtures
        run: |
          SEED_PUBLISH=1 npm run seed:blog
          npm run payload -- run src/scripts/seed-ci.ts
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: failed-browser-checks
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    name: Deploy VPS1
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 40
    concurrency:
      group: acceleret-production
      cancel-in-progress: false
    steps:
      - name: Deploy the checked main commit through restricted SSH
        env:
          DEPLOY_HOST: ${{ vars.VPS_HOST }}
          DEPLOY_USER: ${{ vars.VPS_USER }}
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/acceleret-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/acceleret-hosts"
          ssh -i "$RUNNER_TEMP/acceleret-key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/acceleret-hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=90 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Verify public HTTPS and release identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 30 \
            -D "$RUNNER_TEMP/acceleret-headers" https://acceleret.com/ > /dev/null
          grep -i "x-acceleret-release: $GITHUB_SHA" "$RUNNER_TEMP/acceleret-headers"
          curl --fail --silent --show-error --max-time 30 https://acceleret.com/api/case-studies?limit=1 > /dev/null
